name: Bug report / Ошибка
description: Something does not work as expected / Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys or the local gateway token. / Не вставляйте API-ключи и локальный токен шлюза.
  - type: input
    id: version
    attributes:
      label: App version / Версия приложения
      description: Settings → Updates / Настройки → Обновления
      placeholder: "0.2.3"
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Desktop / Claude Code version / Версия Claude
      placeholder: "Claude Desktop 6.28899.6, Claude Code 2.1.331"
  - type: dropdown
    id: area
    attributes:
      label: Where / Где
      options:
        - Claude Desktop through the gateway / Claude Desktop через шлюз
        - Claude Code console / Консоль Claude Code
        - Projects (agent-kit) / Проекты (agent-kit)
        - Proxy and VPN / Прокси и VPN
        - Settings, updates, the window / Настройки, обновления, окно
        - Other / Другое
  - type: input
    id: kit
    attributes:
      label: agent-kit version, for Projects / Версия agent-kit, для «Проектов»
      description: The version of agent-kit@agent-kit in `claude plugin list` / Версия agent-kit@agent-kit в `claude plugin list`
      placeholder: "3f0470a607fc"
  - type: input
    id: provider
    attributes:
      label: Provider and model / Провайдер и модель
      placeholder: "OpenRouter, deepseek/deepseek-v4"
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло
      description: Steps, what you expected and what you got / Шаги, что ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt / Фрагмент журнала
      description: Window → Log, or %APPDATA%\app.provider-gateway-for-claude\gateway.log
      render: text
