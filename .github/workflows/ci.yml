# An extra check on a clean machine: tools/ci.ps1, the same script that runs locally and in
# the pre-push hook (.githooks). The main gate is local, so it costs nothing for a private
# repository too; there this workflow can simply be disabled.
# The toolchain is pinned so a new stable lint does not break CI without a code change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Checks (tools/ci.ps1, the same script as locally and in the pre-push hook)
        shell: pwsh
        run: ./tools/ci.ps1
