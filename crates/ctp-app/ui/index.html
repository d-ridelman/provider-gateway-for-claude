<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Gateway for Claude</title>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-brand" data-tauri-drag-region>
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M9 18a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M9 18h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="8" cy="18" r="3.4" fill="currentColor"/>
            <circle cx="24" cy="18" r="3.4" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text" data-tauri-drag-region>
          <span class="titlebar-title">Provider Gateway for Claude</span>
          <span class="titlebar-sub" data-i18n="app.subtitle"></span>
        </div>
      </div>
      <div class="titlebar-right">
        <button type="button" id="langBtn" class="tb-btn"></button>
        <button type="button" id="themeBtn" class="tb-btn">
          <svg class="ico-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <svg class="ico-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="updateBtn" class="update-btn hidden" data-i18n-title="update.title"></button>
        <button type="button" id="claudeWarn" class="warn-btn hidden" data-i18n="claudeWarn.label" data-i18n-title="claudeWarn.title"></button>
        <button type="button" id="proxyChip" class="status proxy-chip hidden"><span class="dot" aria-hidden="true"></span><span id="proxyChipText"></span></button>
        <div class="status" role="status" aria-live="polite" data-i18n-title="status.title">
          <span id="statusDot" class="dot" aria-hidden="true"></span>
          <span id="statusText"></span>
          <span class="status-sep" aria-hidden="true"></span>
          <span id="portLabel" class="mono">127.0.0.1:17899</span>
        </div>
        <div class="window-controls">
          <button type="button" id="winMin" class="win-btn" data-i18n-title="win.minimize" data-i18n-aria="win.minimize">
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="winMax" class="win-btn" data-i18n-title="win.maximize" data-i18n-aria="win.maximize">
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="2.8" y="2.8" width="6.4" height="6.4" rx="1" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button type="button" id="winClose" class="win-btn close" data-i18n-title="win.toTray" data-i18n-aria="win.toTray">
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1 class="sidebar-title" data-i18n="sidebar.providers"></h1>
          <button type="button" id="addBtn" class="icon-btn" data-i18n-title="sidebar.add" data-i18n-aria="sidebar.add">+</button>
        </div>
        <nav id="providerList" class="provider-list" data-i18n-aria="sidebar.providers"></nav>
        <div class="sidebar-foot">
          <button type="button" id="projectBtn" class="ghost wide" data-i18n="sidebar.project"></button>
          <button type="button" id="proxyBtn" class="ghost wide" data-i18n="sidebar.proxy"></button>
          <button type="button" id="settingsBtn" class="ghost wide" data-i18n="sidebar.settings"></button>
        </div>
      </aside>

      <section class="content">
        <div id="empty" class="empty">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M9 18a7 7 0 0 1 14 0M9 18h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="8" cy="18" r="3" fill="currentColor"/><circle cx="24" cy="18" r="3" fill="currentColor"/>
            </svg>
          </div>
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n="empty.text"></p>
          <button type="button" id="emptyAdd" class="primary" data-i18n="empty.add"></button>
        </div>

        <form id="providerForm" class="card hidden" autocomplete="off" novalidate>
          <div class="card-head">
            <div class="card-head-text">
              <h2 id="formTitle"></h2>
              <p id="formSubtitle" class="muted"></p>
            </div>
            <div class="badges">
              <span id="formKindBadge" class="badge"></span>
              <span id="formKeyBadge" class="badge soft"></span>
            </div>
          </div>

          <div class="card-body">
          <label id="presetField" class="field hidden">
            <span data-i18n="form.preset"></span>
            <select id="presetInput">
              <option value="" data-i18n="form.presetManual"></option>
            </select>
            <small data-i18n="form.presetHint"></small>
          </label>

          <!-- Compact layout: the whole form fits the default window; narrow cards stack it. -->
          <div class="grid row-ident">
            <label class="field">
              <span data-i18n="form.id"></span>
              <input id="idInput" name="id" placeholder="openai" spellcheck="false" required data-i18n-title="form.idHint">
            </label>
            <label class="field">
              <span data-i18n="form.name"></span>
              <input id="nameInput" name="name" placeholder="OpenAI">
            </label>
            <label class="field">
              <span data-i18n="form.kind"></span>
              <select id="kindInput">
                <option value="openai" data-i18n="form.kindOpenai"></option>
                <option value="anthropic" data-i18n="form.kindAnthropic"></option>
              </select>
            </label>
          </div>

          <div class="grid row-endpoint">
            <label class="field">
              <span data-i18n="form.baseUrl"></span>
              <input id="baseInput" name="baseUrl" type="url" placeholder="https://api.openai.com/v1" spellcheck="false" required>
            </label>
            <div class="field">
              <label for="keyInput" data-i18n="form.apiKey"></label>
              <div class="key-row">
                <input id="keyInput" type="password" autocomplete="new-password" spellcheck="false">
                <button type="button" id="clearKeyBtn" class="ghost danger hidden" data-i18n="form.clearKey"></button>
              </div>
              <small id="keyHint"></small>
            </div>
          </div>

          <div class="grid row-models">
            <div class="field">
              <div class="field-head">
                <label for="modelsInput" data-i18n="form.models" data-help="models"></label>
                <button type="button" id="fetchModelsBtn" class="ghost small" data-i18n="form.fetchModels"></button>
              </div>
              <textarea id="modelsInput" rows="4" spellcheck="false" placeholder="gpt-5.2&#10;deepseek-v4.1-flash[1m]&#10;qwen3:8b"></textarea>
              <small data-i18n-html="form.modelsHint"></small>
            </div>
            <div class="effort-col">
              <label class="field">
                <span data-i18n="form.maxEffort" data-i18n-title="form.maxEffortTitle" data-help="effort"></span>
                <select id="maxEffortInput" data-i18n-title="form.maxEffortTitle">
                  <option value="" data-i18n="form.effortOff"></option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                  <option value="xhigh">xhigh</option>
                  <option value="max">max</option>
                </select>
              </label>
              <label class="field">
                <span data-i18n="form.defaultEffort" data-i18n-title="form.defaultEffortTitle"></span>
                <select id="defaultEffortInput" data-i18n-title="form.defaultEffortTitle">
                  <option value="" data-i18n="form.effortProvider"></option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                  <option value="xhigh">xhigh</option>
                  <option value="max">max</option>
                </select>
              </label>
              <small data-i18n="form.effortHint"></small>
            </div>
          </div>

          <div id="pickerBox" class="picker hidden">
            <div class="picker-head">
              <input id="pickerFilter" type="search" spellcheck="false" data-i18n-placeholder="picker.filter" data-i18n-aria="picker.filter">
              <span id="pickerCount" class="muted small"></span>
              <button type="button" id="pickerClose" class="icon-btn" data-i18n-title="picker.hide" data-i18n-aria="picker.hide">×</button>
            </div>
            <div id="pickerList" class="picker-list"></div>
          </div>

          <details id="aliasBox" class="alias-box hidden">
            <summary id="aliasSummary" class="alias-title"></summary>
            <div id="aliasList" class="alias-list"></div>
          </details>
          </div>

          <div class="form-actions">
            <button type="button" id="deleteBtn" class="ghost danger" data-i18n="form.delete"></button>
            <span id="formNotice" class="notice" aria-live="polite"></span>
            <button type="button" id="testBtn" class="ghost" data-i18n="form.test" data-i18n-title="form.testTitle"></button>
            <button type="submit" id="saveBtn" class="primary" data-i18n="form.save"></button>
          </div>
        </form>

        <div id="projectPanel" class="card hidden">
          <div class="card-head">
            <div class="card-head-text">
              <h2 data-i18n="project.title" data-help="project"></h2>
              <p class="muted" data-i18n="project.subtitle"></p>
            </div>
            <button type="button" id="closeProject" class="ghost" data-i18n="settings.close"></button>
          </div>

          <div class="card-body">
          <section class="group">
            <h3 class="group-title" data-i18n="project.groupFolder"></h3>
            <div class="field">
              <label for="projectDirInput" data-i18n="project.folder"></label>
              <div class="key-row">
                <input id="projectDirInput" spellcheck="false" data-i18n-placeholder="project.folderPlaceholder">
                <button type="button" id="browseProjectBtn" class="ghost" data-i18n="settings.browse"></button>
              </div>
              <small data-i18n="project.folderHint"></small>
            </div>
            <div><button type="button" id="projectCheckBtn" class="ghost" data-i18n="project.check"></button></div>
            <ul id="projectCheckList" class="check-list" aria-live="polite"></ul>
            <div id="projectSourceBox" class="field hidden">
              <label for="projectSourceInput" data-i18n="project.source"></label>
              <div class="key-row">
                <input id="projectSourceInput" spellcheck="false" data-i18n-placeholder="project.sourcePlaceholder">
                <button type="button" id="projectSourceBtn" class="ghost" data-i18n="project.sourceSave"></button>
              </div>
              <small data-i18n="project.sourceHint"></small>
            </div>
            <div id="projectConnectBox" class="field hidden">
              <label class="check"><input type="checkbox" id="projectTeamInput"><span data-i18n="project.team"></span></label>
              <small data-i18n="project.teamHint"></small>
              <div><button type="button" id="projectConnectBtn" class="primary" data-i18n="project.connect"></button></div>
            </div>
          </section>

          <section id="projectStateGroup" class="group hidden">
            <h3 class="group-title" data-i18n="project.groupState" data-help="projectState"></h3>
            <p id="projectStateLine" class="muted small no-margin"></p>
            <p id="projectFresh" class="muted small no-margin hidden" data-i18n="project.newSession"></p>
            <div><button type="button" id="projectUpdateBtn" class="ghost small hidden"></button></div>
            <ul id="projectFindings" class="check-list"></ul>
          </section>

          <section id="projectChecksGroup" class="group hidden">
            <h3 class="group-title" data-i18n="project.groupChecks" data-help="projectChecks"></h3>
            <p id="projectChecksNote" class="muted small no-margin"></p>
            <ul id="projectChecks" class="check-list"></ul>
          </section>

          <section id="projectPlanGroup" class="group hidden">
            <h3 class="group-title" data-i18n="project.groupPlan" data-help="projectPlan"></h3>
            <p id="projectPlanNote" class="muted small no-margin"></p>
            <ul id="projectPlan" class="check-list"></ul>
            <div><button type="button" id="projectApplyBtn" class="primary hidden" data-i18n="project.apply"></button></div>
          </section>
          </div>
        </div>

        <div id="proxyPanel" class="card hidden">
          <div class="card-head">
            <div class="card-head-text">
              <h2 data-i18n="proxy.title" data-help="proxy"></h2>
              <p class="muted" data-i18n="proxy.subtitle"></p>
            </div>
            <button type="button" id="closeProxy" class="ghost" data-i18n="settings.close"></button>
          </div>

          <div class="card-body">
          <section class="group">
            <h3 class="group-title" data-i18n="proxy.groupMode"></h3>
            <div id="proxyModes" class="grid two" role="radiogroup" data-i18n-aria="proxy.groupMode">
              <div class="field">
                <label class="check"><input type="radio" name="proxyMode" value="off"><span data-i18n="proxy.modeOff"></span></label>
                <small data-i18n="proxy.modeOffHint"></small>
              </div>
              <div class="field">
                <label class="check"><input type="radio" name="proxyMode" value="app"><span data-i18n="proxy.modeApp"></span></label>
                <small data-i18n="proxy.modeAppHint"></small>
              </div>
              <div class="field">
                <label class="check"><input type="radio" name="proxyMode" value="system"><span data-i18n="proxy.modeSystem"></span></label>
                <small data-i18n="proxy.modeSystemHint"></small>
              </div>
              <div class="field">
                <label class="check"><input type="radio" name="proxyMode" value="tun"><span data-i18n="proxy.modeTun"></span></label>
                <small data-i18n="proxy.modeTunHint"></small>
              </div>
            </div>
            <div id="proxyErrorBox" class="field hidden">
              <p id="proxyError" class="error-line no-margin" role="alert"></p>
              <div><button type="button" id="proxyToAppBtn" class="ghost small hidden" data-i18n="proxy.toApp"></button></div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="proxy.core"></span>
              <p id="proxyCoreLine" class="muted small no-margin"></p>
              <div><button type="button" id="proxyCoreBtn" class="ghost small"></button></div>
              <small id="proxyCoreHint" aria-live="polite"></small>
            </div>
          </section>

          <section class="group">
            <div class="field-head group-head">
              <h3 class="group-title" data-i18n="proxy.groupNodes"></h3>
              <button type="button" id="measureBtn" class="ghost small" data-i18n="proxy.measure"></button>
            </div>
            <div id="nodeGrid" class="node-grid"></div>
            <p id="nodesEmpty" class="muted small no-margin"></p>
          </section>

          <section class="group">
            <h3 class="group-title" data-i18n="proxy.groupSubs"></h3>
            <ul id="subList" class="sub-list"></ul>
            <form id="subForm" class="grid sub-form" autocomplete="off" novalidate>
              <label class="field">
                <span data-i18n="proxy.subName"></span>
                <input id="subNameInput" spellcheck="false" data-i18n-placeholder="proxy.subNamePlaceholder">
              </label>
              <label class="field">
                <span data-i18n="proxy.subUrl"></span>
                <input id="subUrlInput" class="mono" spellcheck="false" inputmode="url" placeholder="https://">
              </label>
              <label class="field">
                <span data-i18n="proxy.subInterval"></span>
                <select id="subIntervalInput">
                  <option value="6" data-i18n="proxy.every6"></option>
                  <option value="12" selected data-i18n="proxy.every12"></option>
                  <option value="24" data-i18n="proxy.every24"></option>
                </select>
              </label>
              <button type="submit" id="subAddBtn" class="primary" data-i18n="proxy.subAdd"></button>
            </form>
            <div class="field"><small data-i18n="proxy.subHint"></small></div>
          </section>
          </div>
        </div>

        <div id="settingsPanel" class="card hidden">
          <div class="card-head">
            <div class="card-head-text">
              <h2 data-i18n="settings.title"></h2>
              <p class="muted" data-i18n="settings.subtitle"></p>
            </div>
            <button type="button" id="closeSettings" class="ghost" data-i18n="settings.close"></button>
          </div>

          <div class="card-body">
          <div class="settings-cols">
          <div>
          <section class="group">
            <h3 class="group-title" data-i18n="settings.groupDesktop"></h3>
            <div class="field">
              <label for="claudePathInput" data-i18n="settings.claudePath"></label>
              <div class="key-row">
                <input id="claudePathInput" spellcheck="false" data-i18n-placeholder="settings.claudePathPlaceholder">
                <button type="button" id="browseClaudeBtn" class="ghost" data-i18n="settings.browse"></button>
              </div>
              <small id="detectedClaude"></small>
              <small data-i18n="settings.profileNote"></small>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="settings.getDesktop"></span>
              <div class="button-row">
                <button type="button" id="desktopPortableBtn" class="ghost small"></button>
                <button type="button" id="desktopInstallBtn" class="ghost small"></button>
              </div>
              <small id="desktopGetHint" aria-live="polite"></small>
            </div>

            <div class="field">
              <label class="check">
                <input id="russianInput" type="checkbox">
                <span data-i18n="settings.russian"></span>
              </label>
              <small data-i18n-html="settings.russianHint"></small>
              <small id="russianFileHint"></small>
            </div>

            <div class="field">
              <label class="check">
                <input id="builtinBrowserInput" type="checkbox">
                <span data-i18n="settings.builtinBrowser"></span>
              </label>
              <small data-i18n-html="settings.builtinBrowserHint"></small>
              <small data-i18n-html="settings.webSearchNote"></small>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="settings.check"></span>
              <ul id="claudeCheckList" class="check-list" aria-live="polite"></ul>
              <small data-i18n="settings.checkHint"></small>
            </div>
          </section>
          </div>

          <div>
          <section class="group">
            <h3 class="group-title" data-i18n="settings.groupCode" data-help="claudeCode"></h3>
            <div class="field">
              <label for="codeDirInput" data-i18n="settings.codeDir"></label>
              <div class="key-row">
                <input id="codeDirInput" spellcheck="false" data-i18n-placeholder="settings.codeDirPlaceholder">
                <button type="button" id="browseCodeBtn" class="ghost" data-i18n="settings.browse"></button>
              </div>
              <small data-i18n-html="settings.codeDirHint"></small>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="settings.getCode"></span>
              <small id="codeFound"></small>
              <label class="check">
                <input id="codePortableInput" type="checkbox">
                <span data-i18n="settings.codePortable"></span>
              </label>
              <div class="button-row">
                <button type="button" id="codePortableBtn" class="ghost small"></button>
                <button type="button" id="codeInstallBtn" class="ghost small"></button>
              </div>
              <small id="codeGetHint" aria-live="polite"></small>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="settings.roles"></span>
              <label class="field">
                <span data-i18n="settings.roleSonnet"></span>
                <select id="roleSonnet"></select>
              </label>
              <label class="field">
                <span data-i18n="settings.roleCritic" data-help="critic"></span>
                <select id="roleCritic"></select>
                <small data-i18n-html="settings.roleCriticHint"></small>
              </label>
            </div>
          </section>
          </div>
          </div>

          <section class="group">
            <h3 class="group-title" data-i18n="settings.groupApp"></h3>
            <div class="settings-cols">
            <div>
            <div class="grid two">
              <label class="field">
                <span data-i18n="settings.language"></span>
                <select id="languageInput">
                  <option value="auto" data-i18n="settings.langAuto"></option>
                  <option value="ru">Русский</option>
                  <option value="en">English</option>
                </select>
              </label>
              <label class="field">
                <span data-i18n="settings.theme"></span>
                <select id="themeInput">
                  <option value="auto" data-i18n="settings.themeAuto"></option>
                  <option value="light" data-i18n="settings.themeLight"></option>
                  <option value="dark" data-i18n="settings.themeDark"></option>
                </select>
              </label>
            </div>
            <label class="field">
              <span data-i18n="settings.port"></span>
              <input id="portInput" type="number" min="1" max="65535" placeholder="17899">
              <small data-i18n="settings.portHint"></small>
            </label>

            <div class="field">
              <span class="field-label" data-i18n="update.section"></span>
              <p id="versionText" class="muted small no-margin"></p>
              <label class="check">
                <input id="autoUpdateInput" type="checkbox">
                <span data-i18n="update.auto"></span>
              </label>
              <small data-i18n="update.autoHint"></small>
              <div><button type="button" id="checkUpdateBtn" class="ghost small" data-i18n="update.check"></button></div>
            </div>
            </div>

            <div>
            <div class="field">
              <label for="tokenInput" data-i18n="settings.token"></label>
              <div class="key-row">
                <input id="tokenInput" class="mono" readonly>
                <button type="button" id="copyTokenBtn" class="ghost" data-i18n="settings.copy"></button>
              </div>
              <small data-i18n-html="settings.tokenHint"></small>
              <div><button type="button" id="openLogsFolderBtn" class="ghost small" data-i18n="settings.logsFolder"></button></div>
            </div>
            </div>
            </div>
          </section>
          </div>

          <div class="form-actions settings-actions">
            <span class="muted small" aria-live="polite"><span id="settingsDirty" class="dirty-mark hidden" data-i18n="form.unsaved"></span> <span data-i18n="settings.applyHint"></span></span>
            <button type="button" id="saveSettingsBtn" class="primary" disabled data-i18n="settings.save"></button>
          </div>
        </div>
      </section>
    </main>

    <footer class="actions">
      <div class="actions-left">
        <button type="button" id="logsBtn" class="ghost" aria-expanded="false" aria-controls="logPanel" data-i18n="actions.logs"></button>
        <span id="modelCount" class="muted"></span>
        <span id="claudeState" class="claude-state hidden" role="status"><span class="dot" aria-hidden="true"></span><span id="claudeStateText"></span></span>
      </div>
      <div class="actions-right">
        <button type="button" id="startBtn"></button>
        <button type="button" id="stopBtn" class="ghost" data-i18n="actions.stop"></button>
        <button type="button" id="launchCodeBtn" class="ghost" disabled data-i18n="actions.code" data-i18n-title="actions.codeTitle"></button>
        <button type="button" id="launchBtn" class="primary" disabled data-i18n="actions.openClaude" data-i18n-title="actions.openClaudeTitle"></button>
      </div>
    </footer>

    <section id="logPanel" class="logs hidden" data-i18n-aria="logs.title">
      <div class="logs-head">
        <span data-i18n="logs.title"></span>
        <div>
          <button type="button" id="refreshLogsBtn" class="ghost small" data-i18n="logs.refresh"></button>
          <button type="button" id="closeLogsBtn" class="icon-btn" data-i18n-title="logs.close" data-i18n-aria="logs.close">×</button>
        </div>
      </div>
      <pre id="logText"></pre>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toastText" class="toast-text"></span>
      <button type="button" id="toastCopy" class="toast-btn" data-i18n-title="toast.copy" data-i18n-aria="toast.copy">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 10.5V3.5A1.5 1.5 0 0 1 5 2h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="toastClose" class="toast-btn" data-i18n-title="toast.close" data-i18n-aria="toast.close">×</button>
    </div>

    <dialog id="dialog" class="dialog" aria-labelledby="dialogTitle" aria-describedby="dialogText">
      <form method="dialog">
        <h2 id="dialogTitle"></h2>
        <p id="dialogText" class="muted"></p>
        <label id="dialogCheckRow" class="check hidden">
          <input id="dialogCheck" type="checkbox">
          <span id="dialogCheckText"></span>
        </label>
        <div class="dialog-actions">
          <button type="submit" value="alt" id="dialogAlt" class="ghost hidden"></button>
          <button type="submit" value="cancel" id="dialogCancel" class="ghost"></button>
          <button type="submit" value="ok" id="dialogOk" class="primary"></button>
        </div>
      </form>
    </dialog>
    <dialog id="helpDialog" class="dialog help-dialog" aria-labelledby="helpTitle">
      <form method="dialog">
        <h2 id="helpTitle"></h2>
        <div id="helpBody" class="help-body"></div>
        <div class="dialog-actions">
          <button type="submit" class="primary" data-i18n="help.close"></button>
        </div>
      </form>
    </dialog>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
